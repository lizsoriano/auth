# Reverse proxy para /auth -> Flask (login) en 127.0.0.1:5000.
# Mismo patron que /library (monolito) y /soap (books): el servicio no se
# expone directo a Internet, solo NGINX en el puerto 80 publico.
#
# A diferencia de /soap, aqui NO hay riesgo adicional al publicar: todos
# los endpoints de login estan pensados para ser publicos (registro/login
# sin sesion previa) o ya validan la sesion ellos mismos (logout/session).
#
#   GET  /auth/health              -> estado del servicio + PostgreSQL
#   POST /auth/register            -> registrar usuario
#   POST /auth/login                -> iniciar sesion
#   POST /auth/logout               -> cerrar sesion
#   GET  /auth/session              -> sesion activa
#   GET  /auth/verify/<token>       -> confirmar correo
#   POST /auth/resend-verification  -> reenviar enlace de confirmacion
#   GET  /auth/docs/                -> Swagger UI
location /auth/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # la cookie de sesion de Flask debe viajar en las peticiones -- nginx
    # ya reenvia Cookie/Set-Cookie por defecto, no requiere configuracion extra.
}

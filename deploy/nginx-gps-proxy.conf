# Reverse proxy del servidor de rastreo (Flask + Flask-Sock). Igual que /auth, /soap, /users...: solo NGINX escucha en el
# puerto publico y el servicio queda en 127.0.0.1:5900. El prefijo /gps/ se recorta al reenviar.
#
#   http://<IP>/gps/tracking/<codigo>     REST  (Authorization: Bearer <JWT>)
#   ws://<IP>/gps/ws/tracking             WebSocket (el JWT va en el primer mensaje, no en la URL)
#
# Un WebSocket necesita HTTP/1.1 y las cabeceras Upgrade/Connection; sin ellas Nginx lo corta con 400.
# Instalar:  sudo cp nginx-gps-proxy.conf /etc/nginx/default.d/library-gps.conf
#            sudo nginx -t && sudo systemctl reload nginx
location /gps/ {
    proxy_pass http://127.0.0.1:5900/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;      # el rastreo mantiene la conexion abierta mientras dura la entrega
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

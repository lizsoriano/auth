# Reverse proxy de los microservicios nuevos. Solo NGINX escucha en el puerto publico; cada servicio queda en
# 127.0.0.1 (mismo patron que /auth -> 5000, /soap -> 5001 y /library -> 3000). El prefijo se recorta al reenviar.
#
#   /users/    -> 127.0.0.1:5002   usuarios, roles, correos y contraseñas
#   /authors/  -> 127.0.0.1:5003   autores y su relacion con libros
#   /pedidos/  -> 127.0.0.1:5004   pedidos, lineas, stock y estados
#   /pagos/    -> 127.0.0.1:5005   pagos (cabecera Idempotency-Key obligatoria en POST)
#
# Authorization e Idempotency-Key viajan sin cambios (nginx reenvia las cabeceras de la peticion).
# Instalar:  sudo cp nginx-microservices-proxy.conf /etc/nginx/default.d/library-microservices.conf
#            sudo nginx -t && sudo systemctl reload nginx
client_max_body_size 1m;

location /users/ {
    proxy_pass http://127.0.0.1:5002/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /authors/ {
    proxy_pass http://127.0.0.1:5003/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /pedidos/ {
    proxy_pass http://127.0.0.1:5004/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /pagos/ {
    proxy_pass http://127.0.0.1:5005/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

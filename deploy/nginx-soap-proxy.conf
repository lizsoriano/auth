# Reverse proxy para /soap -> Flask (SOAP + REST) en 127.0.0.1:5001.
# Node/Flask no se exponen directamente a Internet; solo NGINX escucha en
# el puerto 80 publico (mismo patron que /library -> 127.0.0.1:3000, ya
# existente en /etc/nginx/default.d/library-proxy.conf, Ejercicio Guiado 02).
#
# El prefijo /soap/ se recorta al reenviar (proxy_pass termina en /), asi
# que las rutas internas de la app quedan expuestas como:
#   GET  /soap/wsdl          -> WSDL del servicio SOAP
#   GET  /soap/books         -> catalogo REST (XML por defecto, ?format=json)
#   GET  /soap/books/<isbn>
#   GET  /soap/books/images
#   GET  /soap/concepts
#   POST /soap/soap          -> envoltorio SOAP (si, con el /soap doblado:
#                                la ruta interna de la app ya se llama /soap)
location /soap/ {
    proxy_pass http://127.0.0.1:5001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

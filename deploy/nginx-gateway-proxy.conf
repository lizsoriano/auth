# Nginx como UNICA puerta publica (puerto 80, por IP: no hace falta dominio).
#
#   /api/...   los MICROSERVICIOS: Nginx -> API Gateway (127.0.0.1:8080) -> servicio en 127.0.0.1
#   /          el MONOLITO (todo lo demas): Nginx -> 127.0.0.1:3000   (su web vive bajo /library/)
#
# Dentro de /api/, cada servicio es un nombre (el gateway recorta el prefijo y deja el endpoint tal cual del servicio):
#   /api/login/...      login     (POST /api/login/login, /api/login/token/refresh, /api/login/logout)
#   /api/books/...      books/SOAP (tambien /api/libros/)
#   /api/users/...      users     (tambien /api/usuarios/)
#   /api/authors/...    authors   (tambien /api/autores/)
#   /api/pedidos/...    pedidos
#   /api/pagos/...      pagos     (cabecera Idempotency-Key en POST)
#   /api/gps/...        rastreo   (REST y WebSocket /api/gps/ws/tracking)
#   /api/health         estado del gateway y de cada servicio (solo up/down; no revela direcciones internas)
#
# Compatibilidad: los prefijos de antes (/auth /soap /users /authors /pedidos /pagos /gps) siguen llegando al gateway,
# para que las apps ya entregadas no se rompan mientras pasan a /api/.
#
# Sin URI en proxy_pass, Nginx envia la ruta COMPLETA y es el gateway quien recorta el prefijo.
# Instalar:  sudo bash deploy/setup_gateway_vm.sh          (copia esto, aparta los .conf por servicio y recarga Nginx)
client_max_body_size 1m;

# WebSocket del rastreo: necesita HTTP/1.1 + Upgrade y conexion larga.
location ~ ^/(api/)?gps/ws/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# La API (REST). Authorization, Idempotency-Key y Cookie viajan sin cambios.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;            # el gateway corta a los 30 s con 504; asi la respuesta es la suya, no la de Nginx
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Prefijos de antes (compatibilidad).
location ~ ^/(auth|soap|users|authors|pedidos|pagos|gps)(/|$) {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Estado del gateway (ruta de antes; ahora tambien /api/health).
location = /gateway/health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_set_header Host $host;
}

# El monolito: todo lo que no es /api. Su web (y las portadas /library/uploads/...) vive bajo /library/.
location = / {
    absolute_redirect off;             # Location: /library/ (sin host ni puerto), valga la IP que valga
    return 302 /library/;
}
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Nginx como UNICA puerta publica (puerto 80, por IP: no hace falta dominio) hacia el API Gateway (127.0.0.1:8080).
# El gateway reparte a los servicios, que siguen en 127.0.0.1. Los prefijos son los mismos de siempre, asi que las apps
# (Java, Tkinter, Electron) no cambian: solo hablan con el gateway.
#
#   /auth/ /soap/ /users/ /authors/ /pedidos/ /pagos/ /gps/   ->  127.0.0.1:8080  (el gateway recorta el prefijo)
#   /library/ (monolito de portadas)  se queda como estaba: lo sirve su propio library-proxy.conf (127.0.0.1:3000).
#
# Sin URI en proxy_pass, Nginx envia la ruta COMPLETA (con prefijo) y es el gateway quien la recorta.
# Instalar:  sudo bash deploy/setup_gateway_vm.sh          (copia esto, aparta los .conf por servicio y recarga Nginx)
client_max_body_size 1m;

# WebSocket del rastreo: necesita HTTP/1.1 + Upgrade y conexion larga.
location ~ ^/gps/ws/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Resto de la API (REST). Authorization, Idempotency-Key y Cookie viajan sin cambios.
location ~ ^/(auth|soap|users|authors|pedidos|pagos|gps)(/|$) {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;            # el gateway corta a los 30 s con 504; asi la respuesta es la suya, no la de Nginx
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Estado del gateway y de los servicios (solo nombres y up/down; no revela direcciones internas).
location = /gateway/health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_set_header Host $host;
}

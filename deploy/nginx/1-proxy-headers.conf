# [1/4] NGINX COMO PROXY: las cabeceras comunes de todo lo que Nginx reenvia (reverse proxy).
# No define ninguna ruta: cada `location` de los otros 3 archivos la incluye con
#     include /etc/nginx/library/proxy-headers.conf;
# Instalar como /etc/nginx/library/proxy-headers.conf (lo hace deploy/setup_gateway_vm.sh).
#
#   proxy_http_version 1.1      keep-alive hacia el servicio y requisito de los WebSockets
#   Host                        el host que escribio el cliente (la IP o el dominio de la VM)
#   X-Real-IP / X-Forwarded-For la IP real del cliente (los servicios solo ven a Nginx en 127.0.0.1)
#   X-Forwarded-Proto           http o https segun como llego el cliente
# Authorization, Idempotency-Key y Cookie NO se tocan: Nginx reenvia las cabeceras de la peticion tal cual.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

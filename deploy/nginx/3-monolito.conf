# [3/4] EL MONOLITO: todo lo que NO es /api va a la aplicacion web (Node.js/Express, library-web.service).
# Instalar como /etc/nginx/default.d/library-monolito.conf.
#
#   /          ->  302 /library/        (la web de Library vive bajo /library/)
#   /library/  ->  127.0.0.1:3000       (pagina web y portadas /library/uploads/...)
#   cualquier otra ruta que no sea /api  ->  127.0.0.1:3000
#
# /api/ es mas especifico, asi que gana: los microservicios nunca llegan al monolito.
location = / {
    absolute_redirect off;             # Location: /library/ (sin host ni puerto), valga la IP que valga
    return 302 /library/;
}
location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/library/proxy-headers.conf;
}

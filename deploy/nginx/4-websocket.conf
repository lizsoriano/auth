# [4/4] WEBSOCKET: el rastreo del pedido (vehiculo en el mapa) llega por una conexion persistente.
# Instalar como /etc/nginx/default.d/library-websocket.conf.
#
#   ws://<IP>/api/gps/ws/tracking      (tambien /gps/ws/tracking, el prefijo de antes)
#
# Un WebSocket empieza como una peticion HTTP normal que pide "cambiar de protocolo". Sin estas lineas Nginx corta con 400:
#   proxy_http_version 1.1             (HTTP/1.0 no soporta Upgrade)
#   Upgrade: $http_upgrade             reenvia lo que pidio el cliente (websocket)
#   Connection: upgrade                mantiene el tunel abierto
#   proxy_read_timeout / send_timeout  la conexion dura lo que dure la entrega: sin esto Nginx la cierra a los 60 s
# El JWT va en el primer mensaje del WebSocket, no en la URL.
# Orden: Nginx prueba los `location ~` (regex) en el orden de los archivos y se queda con el primero que coincide, asi que este se
# instala como 10-library-websocket.conf (antes que 20-library-api.conf): /gps/ws/... debe ganar a la regla de prefijos de antes.
location ~ ^/(api/)?gps/ws/ {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/library/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# [2/4] PREFIJOS PARA IPs Y PUERTOS: /api/<nombre> -> servicio. Los microservicios SON la API.
# Instalar como /etc/nginx/default.d/library-api.conf (va dentro del `server`, por IP: no hace falta dominio).
#
# Nginx envia TODA /api/ al API Gateway (127.0.0.1:8080); el gateway reconoce el prefijo, lo recorta y reenvia
# el resto al servicio. Nadie de afuera ve IPs ni puertos de los servicios:
#
#   prefijo publico (afuera)        servicio           IP:puerto interno (adentro, solo loopback)
#   /api/login/...                  login              127.0.0.1:5000
#   /api/books/...  (o /libros/)    books / SOAP       127.0.0.1:5001
#   /api/users/...  (o /usuarios/)  users              127.0.0.1:5002   (en la VM actual: 5004)
#   /api/authors/... (o /autores/)  authors            127.0.0.1:5003   (en la VM actual: 5005)
#   /api/pedidos/...                pedidos            127.0.0.1:5004   (en la VM actual: 5003)
#   /api/pagos/...                  pagos              127.0.0.1:5005   (en la VM actual: 5002)
#   /api/gps/...                    rastreo            127.0.0.1:5900   (el WebSocket esta en 4-websocket.conf)
#   /api/health                     estado del gateway y de cada servicio
#
# Ejemplo:  http://<IP>/api/login/login  ->  gateway  ->  http://127.0.0.1:5000/login
# (los puertos reales de cada servicio los lee deploy/setup_gateway_vm.sh de su unit de systemd)
#
# Sin URI en proxy_pass, Nginx envia la ruta COMPLETA y es el gateway quien recorta el prefijo.
client_max_body_size 1m;

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/library/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;            # el gateway corta a los 30 s con 504; asi la respuesta es la suya, no la de Nginx
}

# Prefijos de antes (compatibilidad con las apps ya entregadas): mismo gateway.
location ~ ^/(auth|soap|users|authors|pedidos|pagos|gps)(/|$) {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/library/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
}

# Estado del gateway (ruta de antes; ahora tambien /api/health).
location = /gateway/health {
    proxy_pass http://127.0.0.1:8080/health;
    include /etc/nginx/library/proxy-headers.conf;
}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-common"
version = "0.1.0"
description = "Piezas comunes de los microservicios Library: JWT, capa Redis, errores, serializadores y métricas."
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-Cors>=4.0,<5",
    "PyJWT>=2.8,<3",
    "redis>=5.0,<6",
]

[tool.setuptools.packages.find]
include = ["library_common*"]
